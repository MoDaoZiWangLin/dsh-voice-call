name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check scripts/wire-profile.mjs
          node --check scripts/unwire-profile.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: |
          python -m py_compile engine/server.py scripts/fetch_model.py
      - name: JSON check
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"
